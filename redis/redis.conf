# Redis 7 — San Luquitas (colas de Laravel, caché y sesiones)
# La contraseña NO va aquí: se pasa con --requirepass desde el .env (compose.yaml).
# Nota: redis.conf no admite comentarios al final de una línea.

# Escucha dentro de la red Docker "backend"; el puerto no se publica al host
bind 0.0.0.0
protected-mode yes
port 6379

# Persistencia AOF: los trabajos encolados (mensajes de WhatsApp) sobreviven
# a reinicios. everysec = como máximo se pierde ~1 s de escrituras ante un corte.
appendonly yes
appendfsync everysec
dir /data

# Snapshots RDB adicionales
save 900 1
save 300 10

# Comandos peligrosos deshabilitados (FLUSHDB se conserva: lo usa "php artisan cache:clear")
rename-command FLUSHALL ""
rename-command DEBUG ""

# Límite de memoria; noeviction = nunca descartar trabajos de la cola
maxmemory 256mb
maxmemory-policy noeviction
