# Portal Institucional San Luquitas — Laravel 12 (PHP-FPM en "laravel-app")
server {
    listen 443 ssl;
    http2 on;
    server_name portal.sanluquitas.local;

    ssl_certificate     /etc/nginx/certs/sanluquitas.crt;
    ssl_certificate_key /etc/nginx/certs/sanluquitas.key;

    include /etc/nginx/conf.d/includes/security-headers.inc;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    location ~ /\.(?!well-known) { deny all; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Front controller de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass laravel-app:9000;
    }

    # Ningún otro .php es ejecutable
    location ~ \.php$ { return 404; }
}
