# San Luquitas Digital — Moodle 5.x (PHP-FPM en el contenedor "moodle")
server {
    listen 443 ssl;
    http2 on;
    server_name moodle.sanluquitas.local;
    set $moodle_fpm moodle:9000;   # se resuelve en cada petición (ver resolver en 00-general.conf)

    ssl_certificate     /etc/nginx/certs/sanluquitas.crt;
    ssl_certificate_key /etc/nginx/certs/sanluquitas.key;

    include /etc/nginx/conf.d/includes/security-headers.inc;

    # Desde Moodle 5.1 solo se publica la carpeta public/.
    # Si se instala Moodle 5.0, cambiar a: root /var/www/moodle;
    root /var/www/moodle/public;
    index index.php;

    # Archivos ocultos y de desarrollo que no deben servirse
    location ~ /\.(?!well-known) { deny all; }
    location ~ (/vendor/|/node_modules/|composer\.(json|lock)|/upgrade\.txt|/UPGRADING\.md|/readme|/README|readme\.txt|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|environment\.xml) {
        deny all;
        return 404;
    }

    # Archivos estáticos; si no existen, el router de Moodle (r.php) atiende la ruta
    location / {
        try_files $uri $uri/ /r.php;
    }

    # PHP con "slash arguments" (p. ej. /pluginfile.php/12/mod_resource/...)
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }

        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass $moodle_fpm;
    }
}
