# Puerto 80: todo se redirige a HTTPS conservando el nombre y la ruta.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Puerto 443 con un nombre desconocido (por ejemplo, entrar por la IP):
# se cierra la conexión sin responder.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sanluquitas.crt;
    ssl_certificate_key /etc/nginx/certs/sanluquitas.key;

    return 444;
}
