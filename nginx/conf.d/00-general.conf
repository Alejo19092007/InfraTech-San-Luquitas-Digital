# Ajustes globales (contexto http) — San Luquitas
# Todos los *.conf de esta carpeta los incluye el nginx.conf de la imagen oficial.

server_tokens off;                 # no revelar la versión de Nginx
client_max_body_size 100M;         # subida de archivos a Moodle (igual a post_max_size de PHP)

# TLS
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Respuestas grandes de PHP-FPM (páginas de Moodle)
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
fastcgi_read_timeout 300s;

# DNS interno de Docker. Los backends se resuelven en cada petición (variables
# en fastcgi_pass), así Nginx arranca aunque Moodle o Laravel no estén activos
# y sigue funcionando cuando un contenedor se recrea con otra IP.
resolver 127.0.0.11 valid=10s ipv6=off;
