# Entrada exclusiva para Cloudflare Tunnel (bot de WhatsApp).
# Escucha en el puerto 8081 SOLO dentro de la red Docker "frontend":
# no se publica al host, así que desde la LAN o internet no se llega
# a este puerto si no es a través del túnel.
# cloudflared debe apuntar a: http://nginx:8081
server {
    listen 8081;
    server_name _;

    include /etc/nginx/conf.d/includes/security-headers.inc;
    client_max_body_size 1m;    # los eventos de Meta son JSON pequeños

    # Única ruta expuesta a internet: verificación (GET) y eventos (POST) de Meta
    location = /webhook/whatsapp {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;          # el cliente llegó por HTTPS a Cloudflare
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass laravel-app:9000;
    }

    # Cualquier otra ruta del portal no es accesible por el túnel
    location / { return 404; }
}
